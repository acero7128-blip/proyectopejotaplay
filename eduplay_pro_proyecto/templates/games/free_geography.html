{% extends "base.html" %}
{% block content %}
<div class="game-header">
    <a href="{{ url_for('dashboard') }}" class="btn-back">← Volver al Panel</a>
    <h2>Juego Gratuito 3: Geografía de Venezuela</h2>
    <span class="badge active">Acceso Libre Registrado</span>
</div>
<div class="card game-container">
    <p class="game-desc">Trivias sobre estados, capitales, relieves, ríos y símbolos naturales del país.</p>
    <div class="stats">
        <div>Puntuación: <strong id="score">0</strong></div>
        <div>Pregunta: <strong id="progress">0 / 0</strong></div>
    </div>
    <div id="question-box" class="question">Presiona Iniciar para comenzar la trivia</div>
    <div id="options-box" class="options-grid"></div>
    <button id="start-btn" class="btn-secondary">Iniciar / Reiniciar</button>
    <p id="feedback" class="feedback"></p>
</div>
<script src="{{ url_for('static', filename='js/geography_game.js') }}"></script>
{% endblock %}
